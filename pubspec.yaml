name: trading_app
description: "Cross-platform algorithmic trading app with Rust strategy engine"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Charting
  fl_chart: ^1.2.0
  candlesticks: ^3.0.1

  # Networking
  http: ^1.4.0
  web_socket_channel: ^3.0.0

  # State Management
  provider: ^6.1.4

  # Utilities
  intl: ^0.20.2
  yaml: ^3.1.2

  # Studies viewer (Welle O3-B2): SQLite FFI + file picker
  sqflite_common_ffi: ^2.4.1
  file_picker: ^11.0.2

  # Welle P4P (Bitunix futures connector): API credentials in platform-secure
  # storage (DPAPI on Windows, Keychain on macOS/iOS, libsecret on Linux,
  # Android Keystore-backed storage on Android) plus double-SHA-256 signing.
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.3

  # Welle B4.3 (risk layer): persistent risk limits + kill-switch state in
  # plain key-value storage. Non-sensitive — secure_storage would be overkill.
  shared_preferences: ^2.2.0

  # Rust Bridge
  flutter_rust_bridge: 2.12.0
  ffi: ^2.1.0
  trading_engine:
    path: rust_builder
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Welle P4C-H-2: time-compressed tests for the chart stale-watchdog.
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

